name: telegram_chats_bot

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: telegram_chats_bot:latest
    container_name: telegram_chats_bot
    env_file:
      - .env
    ports:
      - "${WEB_PORT:-8000}:${WEB_PORT:-8000}"
      - "${AGENT_API_PORT:-8765}:${AGENT_API_PORT:-8765}"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    restart: unless-stopped
    init: true
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fsS "http://127.0.0.1:${WEB_PORT:-8000}/api/health" >/dev/null 2>&1
          || curl -fsS "http://127.0.0.1:${WEB_PORT:-8000}/" >/dev/null 2>&1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

  # Optional local Bot API (2 GB files). Enable with:
  #   docker compose --profile local-bot-api up -d --build
  # Requires docker/telegram-bot-api.env (see README).
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    container_name: telegram_chats_bot-bot-api
    profiles: ["local-bot-api"]
    restart: unless-stopped
    env_file:
      - docker/telegram-bot-api.env
    volumes:
      - telegram-bot-api-data:/var/lib/telegram-bot-api
    ports:
      - "127.0.0.1:8081:8081"

  # Serves files stored by the local Bot API. The app reads them through
  # TELEGRAM_FILES_BASE=http://bot-api-files:80 inside the compose network.
  bot-api-files:
    image: nginx:alpine
    container_name: telegram_chats_bot-bot-api-files
    profiles: ["local-bot-api"]
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cat > /etc/nginx/conf.d/default.conf <<'EOF'
        server {
            listen 80;
            server_name _;

            location = /health {
                access_log off;
                add_header Content-Type text/plain;
                return 200 "ok\n";
            }

            # tgclient обращается к http://bot-api-files/<botid>:<token>/...
            location / {
                root /var/lib/telegram-bot-api;
                autoindex off;
            }

            # Совместимость с /file/bot<token>/<path>
            location /file/ {
                rewrite ^/file/bot(.+)$ /$1 break;
                root /var/lib/telegram-bot-api;
                autoindex off;
            }
        }
        EOF
        exec nginx -g 'daemon off;'
    volumes:
      - telegram-bot-api-data:/var/lib/telegram-bot-api:ro
    ports:
      - "127.0.0.1:8082:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  telegram-bot-api-data:
    name: telegram_chats_bot-bot-api-data
